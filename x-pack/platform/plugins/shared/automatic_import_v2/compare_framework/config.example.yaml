integrations_dir: ~/git/integrations
kibana_url: http://localhost:5601
connector_id: "<inference-connector-id>"
auth:
  type: api_key  # or basic
  api_key: "..." # or username/password
packages: [nginx, redis]  # or path to list file
# data_streams:          # optional: filter which data streams per package (omit package to test all)
#   nginx: [access]
#   redis: [log, slowlog]
output_dir: ./output
# pregenerated_packages_dir: ./output/run_20260220_120917/packages  # when set, load package zips from here instead of calling Kibana API
ecs_fields_url: "https://github.com/elastic/ecs/raw/v9.3.0/generated/csv/fields.csv"
# Consistency mode (default: cross_package_only)
consistency_runs: 10
# consistency_compare_mode: cross_package_only   # default; or per_package
# pass_threshold: 80
# score_weights: { programmatic: 0.3, pipeline_equivalence: 0.25, processor_choice: 0.2, ecs_vendor: 0.25 }
# skip_packages_without_samples: true
# cleanup_after_run: true
# http_retries: 3
# http_timeout: 60s
# gemini_timeout: 120s
# gemini_temperature: 0
# seed: 42
# integrations_ref: "main"
# gemini_model: "gemini-3-flash-preview"
# langsmith:                    # optional: enable LangSmith tracing
#   project_name: "my-project"
#   api_key: "lsv2_pt_..."
